<!-- passage de variable planned_activities-->
<!-- https://tailwindflex.com/@oliver-hansen/table-template-2 -->
<div class="shadow-lg rounded-lg overflow-hidden mx-4 md:mx-10">
    <table class="w-full table-fixed">
        <thead>
            <tr class="bg-[#00787010]">
                <th class="w-1/4 py-4 px-6 text-left text-gray-600  font-bold uppercase">Date du créneau</th>
                <th class="w-1/4 py-4 px-6 text-left text-gray-600 font-bold uppercase">Compétence</th>
                <th class="w-1/4 py-4 px-6 text-left text-gray-600 font-bold uppercase">Activité</th>
                <th class="w-1/4 py-4 px-6 text-left text-gray-600 font-bold uppercase">Description</th>
            </tr>
        </thead>
        <tbody class="bg-white">
            {% for planned_activity in planned_activities %}
            <tr onclick="location.href='{% url 'echangecompetence:detail-activity' planned_activity.id %}'" class="cursor-pointer hover:bg-gray-100">
                <td class="py-4 px-6 border-b border-gray-200 truncate">{{ planned_activity.date }}</td>
                <td class="py-4 px-6 border-b border-gray-200 truncate">{{ planned_activity.activity.skill.name }}</td>
                <td class="py-4 px-6 border-b border-gray-200 truncate">{{ planned_activity.activity.name }}</td>
                <td class="py-4 px-6 border-b border-gray-200 truncate">{{ planned_activity.description }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
