{% extends "base.html" %}
{% block main %}
<form method="post">
    {% csrf_token %}
    {% for skill in skills %}

    <input type="checkbox" id="skill_{{ skill.id }}" name="skills" value="{{ skill.id }}" {% if skill.user_has_skill %}checked{% endif %}>
    <label for="skill_{{ skill.id }}">{{ skill.name }}</label><br>
    {% endfor %}
    <input type="submit" value="Enregistrer mes compétences" class="default">
</form>
{% endblock %}
